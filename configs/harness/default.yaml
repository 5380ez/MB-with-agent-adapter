# MobilityBench Harness Configuration
#
# Mirrors the paper's `experiment.yaml`: the harness is everything around the
# agent loop (tools, context/memory, skills, planning, sandbox rules, retries
# and stopping policies). Each stanza pins how one agent-under-test is launched
# so runs stay reproducible and adapters stay free of hard-coded launch flags.
#
# Fields:
#   bin            executable name (or absolute path); env overrides exist per
#                  adapter (CODEX_BIN / CLAUDE_BIN / DSH_BIN / MINI_BIN)
#   protocol       wire protocol the CLI speaks: openai | anthropic
#   wire_api       openai-protocol variant: chat | responses
#   profile        named launch profile (dsh only; `headless` is the one-shot app)
#   version        pinned CLI version used for the run
#   context_window model context window in tokens
#   max_output_tokens  per-response output budget the harness requests (claude
#                  defaults to 32000, which overflows a 32768-token window)
#   timeout        wall-clock budget per case, seconds
#   max_steps      harness step budget (0 = harness default)
#   effort         reasoning effort hint, when the harness supports one
#   mcp_client     whether the adapter wires the sandbox MCP server into the run
harnesses:
  codex:
    bin: codex
    protocol: openai
    wire_api: responses
    version: ""
    context_window: 32768
    timeout: 900
    mcp_client: true

  claude_code:
    bin: claude
    protocol: anthropic
    version: ""
    context_window: 32768
    max_output_tokens: 4096
    timeout: 900
    mcp_client: true

  # dsh's one-shot app is the `headless` profile: `dsh --profile headless --json "<task>"`.
  # The model route is injected per run via a --patch overlay (llm-pi-ai ->
  # OpenAI-compatible vLLM), so nothing here hard-codes the endpoint.
  dsh:
    bin: dsh
    protocol: openai
    wire_api: chat
    profile: headless
    version: ""
    context_window: 32768
    timeout: 900
    mcp_client: true

  # dsh-mini: the paper's minimal arm — dsh's standalone ``sdk-minimal`` profile
  # (no dsh-base: a persistent shell plus the sandbox MCP tools mounted by the
  # adapter's ``--patch`` overlay). Driven over the SDK JSON-RPC protocol, not
  # the one-shot ``--json`` mode the full ``headless`` arm uses.
  dsh_mini:
    bin: dsh
    protocol: openai
    wire_api: chat
    profile: sdk-minimal
    version: ""
    context_window: 32768
    timeout: 900
    mcp_client: true

  # mini-swe-agent: the model is configured through litellm `model_name` +
  # `model_kwargs` (base_url/api_key), and the transcript is written to
  # `--output <path>` as a mini-swe-agent trajectory, not to stdout.
  mini_swe:
    bin: mini
    protocol: openai
    wire_api: chat
    version: ""
    context_window: 32768
    timeout: 900
    max_steps: 0
    mcp_client: false

  # openclaw: a multi-channel AI gateway whose `agent --local --json` runs one
  # embedded agent turn (no gateway daemon) — the codex-`exec` / claude-`-p`
  # analogue. The adapter writes a per-run openclaw.json (vllm provider +
  # sandbox MCP server); the reply and token usage come from the --json stdout
  # and the tool trajectory from the session-transcript JSONL.
  openclaw:
    bin: openclaw
    protocol: openai
    wire_api: chat
    version: "2026.7.1"
    context_window: 32768
    max_output_tokens: 4096
    timeout: 900
    mcp_client: true

  # hermes: Nous Research hermes-agent, driven through an in-process one-shot
  # driver over `hermes_cli.oneshot`. The adapter writes a per-run
  # HERMES_HOME/config.yaml (custom provider -> local vLLM + sandbox MCP); the
  # driver returns the answer + token usage and the tool trajectory is read
  # from the session transcript. hermes enforces a 64K context floor, so its
  # config declares 65536 while the served window stays 32768 for short tasks.
  hermes:
    bin: hermes
    protocol: openai
    wire_api: chat
    version: "v2026.5.7"
    context_window: 32768
    max_output_tokens: 4096
    timeout: 900
    mcp_client: true
